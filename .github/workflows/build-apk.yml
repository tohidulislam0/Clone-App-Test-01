name: Build TwinSpace APK

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "app/TwinSpace.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Create debug.keystore if not present
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TwinSpace-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Place TwinSpace.apk inside app folder in GitHub repo
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/TwinSpace.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/TwinSpace.apk
          git diff --staged --quiet || (git commit -m "Add compiled TwinSpace.apk to app folder" && git push)
